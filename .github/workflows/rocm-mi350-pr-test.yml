name: ROCm MI350 runnert-test

# Runs the 13 integrated-PR testcases (suite stage-runnert-mi350) one-by-one on
# a self-hosted MI350 runner, using the miles-baked sgl-dev image. Triggered by
# pushing the runnert-test branch, or manually via workflow_dispatch.
on:
  push:
    branches: [runnert-test]
  workflow_dispatch:
    inputs:
      continue_on_error:
        description: "Keep running remaining tests after a failure"
        type: boolean
        default: true

jobs:
  rocm-mi350:
    runs-on: [self-hosted, mi350]
    container:
      image: rocm/sgl-dev:miles-rocm700-mi35x-20260708
      # ROCm equivalents of _run-ci.yml's CUDA options: expose the GPUs via
      # /dev/kfd + /dev/dri (not --gpus all), forward HIP_VISIBLE_DEVICES.
      options: >-
        --device /dev/kfd --device /dev/dri
        --group-add 44 --group-add 109
        --security-opt seccomp=unconfined
        --ipc=host --shm-size=32g
        --privileged
        --ulimit memlock=-1 --ulimit stack=67108864
        --env HIP_VISIBLE_DEVICES
        -v /data/miles_ci:/data/miles_ci
        -v /data/miles_ci/models:/root/models
        -v /data/miles_ci/datasets:/root/datasets
        -v /data/miles_ci/hf_cache:/root/.cache/huggingface
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      HF_HOME: /root/.cache/huggingface
      GITHUB_COMMIT_NAME: ${{ github.sha }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup stale GPU processes
        shell: bash
        run: |
          ray stop --force 2>/dev/null || true
          pkill -9 sglang 2>/dev/null || true
          pkill -9 -f raylet 2>/dev/null || true
          pkill -9 -f gcs_server 2>/dev/null || true
          pkill -9 -f train_async 2>/dev/null || true
          sleep 3

      - name: Wait for ROCm GPUs
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if rocm-smi --showid >/dev/null 2>&1; then
              echo "ROCm ready after $((i-1)) retry(s)"
              rocm-smi --showproductname 2>/dev/null | head || true
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: rocm-smi did not become ready after 120s" >&2
          exit 1

      - name: Install miles (SGLang + Megatron are baked into the image)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          pip install -e . --no-deps --break-system-packages
          pip install polars --break-system-packages || true
          # megatron-bridge training tests hard-import modelopt
          pip install nvidia-modelopt --break-system-packages || true

      - name: Apply ROCm SGLang patches (meta_info + yarn)
        shell: bash
        run: python3 tests/ci/rocm_sglang_patches.py

      - name: Resolve suite plan
        shell: bash
        run: python3 tests/ci/run_suite.py --hw rocm --suite stage-runnert-mi350 --match-all-labels --continue-on-error --list-only

      - name: Run tests
        shell: bash
        run: python3 tests/ci/run_suite.py --hw rocm --suite stage-runnert-mi350 --match-all-labels --continue-on-error
